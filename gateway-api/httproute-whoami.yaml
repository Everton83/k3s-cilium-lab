apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: default
spec:
  # Hostname explícito é obrigatório: sem ele, esta rota se anexa e casa com
  # TODO listener do my-gateway (um catch-all pro Gateway inteiro), já que o
  # parentRefs abaixo também não tem sectionName — isso sequestrou o próprio
  # hostname do ArgoCD no listener https-argocd até isso ser adicionado (ver
  # o log de incidentes em ../README.md).
  hostnames:
    - whoami.192.168.3.200.nip.io
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: my-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: whoami
          port: 80
