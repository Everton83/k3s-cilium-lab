apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          # `All` so workloads in their own namespaces (e.g. ns `argocd`) can
          # attach an HTTPRoute to this shared gateway. Was `Same` (default ns only).
          from: All
    - name: https-argocd
      hostname: argocd.192.168.3.200.nip.io
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        # Self-signed cert for argocd.192.168.3.200.nip.io, SNI-selected.
        certificateRefs:
          - kind: Secret
            name: argocd-tls
      allowedRoutes:
        namespaces:
          from: All
    # Add one hostname-scoped listener like https-argocd per app you expose —
    # do NOT add a hostname-less "https" catch-all listener. One existed here
    # for Backstage (removed) and silently caught every HTTPS request to
    # every OTHER hostname too, since a listener with no `hostname` matches
    # any SNI. See gateway.networking.k8s.io semantics + httproute-whoami.yaml's
    # comment for the same gotcha from the HTTPRoute side.
# With Cilium gatewayAPI.hostNetwork.enabled=true, Envoy binds :80 and :443 on the
# node IP. http://192.168.3.200/ and https://192.168.3.200/ . Service is NodePort.
