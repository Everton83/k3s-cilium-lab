apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          # `All` pra que workloads em seus próprios namespaces (ex.: ns
          # `argocd`) possam anexar um HTTPRoute a este gateway compartilhado.
          # Era `Same` (só o namespace default).
          from: All
    - name: https-argocd
      hostname: argocd.192.168.3.200.nip.io
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        # Certificado self-signed para argocd.192.168.3.200.nip.io, selecionado por SNI.
        certificateRefs:
          - kind: Secret
            name: argocd-tls
      allowedRoutes:
        namespaces:
          from: All
    # Adicione um listener escopado por hostname como o https-argocd pra cada
    # app que expuser — NÃO adicione um listener "https" catch-all sem
    # hostname. Um listener assim existia aqui pro Backstage (removido) e
    # capturava silenciosamente toda requisição HTTPS de QUALQUER outro
    # hostname também, já que um listener sem `hostname` casa com qualquer
    # SNI. Ver a semântica do gateway.networking.k8s.io + o comentário do
    # httproute-whoami.yaml pra a mesma pegadinha do lado do HTTPRoute.
# Com gatewayAPI.hostNetwork.enabled=true no Cilium, o Envoy liga as portas
# :80 e :443 diretamente no IP do node. http://192.168.3.200/ e
# https://192.168.3.200/ . O Service vira NodePort.
