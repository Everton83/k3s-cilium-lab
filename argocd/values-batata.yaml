# Values do ArgoCD para o batata-server (192.168.3.200, k3s single-node)
#
# Repo:    helm repo add argo https://argoproj.github.io/argo-helm
# Chart:   argo/argo-cd  10.9.0  (versão do app v3.5.2)
# Release: helm install argocd argo/argo-cd -n argocd --create-namespace -f values-batata.yaml
#
# Enxugado para um host com memória limitada (3.3Gi de RAM total,
# compartilhado com o resto da stack do batata-server — ver ../README.md):
#   - dex, notifications e applicationset desabilitados (sem SSO /
#     notificações / ApplicationSets em uso hoje — reative se isso mudar)
#   - requests/limits de recurso bem abaixo dos padrões do chart
#
# NOTA (2026-09-11): applicationSet.enabled: false NÃO impediu o pod
# argocd-applicationset-controller de ser implantado no chart 10.9.0 — ele
# sobe de qualquer jeito. Deixado como está (footprint baixo), mas vale
# checar o values.yaml/templates do chart se isso importar depois.
#
# Exposto via Gateway API em https://argocd.192.168.3.200.nip.io — o TLS é
# terminado no Gateway (my-gateway/default, listener "https-argocd", secret
# de certificado argocd/argocd-tls, self-signed), por isso server.insecure
# está definido abaixo (mesmo raciocínio do próprio NOTES.txt do chart:
# termine o SSL no seu ingress e deixe o argocd-server falar HTTP puro por
# trás dele). Ver ../gateway-api/ para os manifests de Gateway + HTTPRoute
# dos quais isso depende.

configs:
  params:
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false
  # o enabled:false acima não impede de verdade esse controller de ser
  # implantado no chart 10.9.0 (ver nota acima) — deu-se a ele um teto de
  # recurso também, pra pelo menos ser contabilizado no orçamento de memória
  # do host em vez de rodar sem limite.
  resources:
    requests:
      cpu: 15m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

controller:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
