# Values do Helm do Cilium — release "cilium" no namespace kube-system (chart cilium-1.20.1)
# Aplicado no batata-server (k3s single-node, 192.168.3.200).
# Reproduzir com:  helm upgrade --install cilium cilium/cilium -n kube-system \
#                    --version 1.20.1 -f values.yaml
#
# NOTA: `loadBalancer.l2.enabled` abaixo NÃO é uma chave real do chart (no-op)
#       — foi deixada como aplicada originalmente. A chave que de fato habilita
#       o L2 é `l2announcements.enabled` (definida como true mais abaixo).
#
# blocos de resources: adicionados em 2026-09-11, dimensionados com base no
# RSS real observado em regime permanente (ver README.md), parte do esforço
# de encaixar toda a stack do batata-server num orçamento de ~3GB depois de
# um incidente de swap-thrashing. Valide com `helm upgrade --dry-run` antes
# de aplicar — este chart controla o CNI.

k8sServiceHost: 192.168.3.200
k8sServicePort: 6443
kubeProxyReplacement: true

operator:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 160Mi

tolerations:
  - operator: Exists

# --- Gateway API (modo host-network: o Envoy liga a porta do listener no IP do node) ---
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true

# O Envoy (DaemonSet externo) precisa de NET_BIND_SERVICE pra ligar a porta
# privilegiada 80 no host. As duas capabilities abaixo são exigidas juntas.
envoy:
  securityContext:
    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
      keepCapNetBindService: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 300m
      memory: 96Mi

securityContext:
  capabilities:
    envoy:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
      - PERFMON
      - DAC_OVERRIDE
      - FOWNER
      - IPC_LOCK
      - NET_BIND_SERVICE

# O cilium-agent em si (container principal do DaemonSet).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# --- LoadBalancer: L2 announcements + LB-IPAM (pool definido em loadbalancer-ippool.yaml) ---
l2announcements:
  enabled: true
  leaseDuration: 15s
  leaseRenewDeadline: 5s
  leaseRetryPeriod: 2s

loadBalancer:
  l2:
    enabled: true   # chave no-op (ver nota no topo)

k8sClientRateLimit:
  qps: 50
  burst: 100

# --- Hubble ---
hubble:
  enabled: true
  relay:
    enabled: true

# --- ClusterMesh: DESATIVADO em 2026-09-11 ---
# Foi habilitado em 2026-09-10 mas nunca chegou a parear com nada de verdade
# (sempre "0/0 remote clusters") — 3 containers sempre ativos (etcd,
# apiserver, kvstoremesh) por uma funcionalidade que não fazia nada. Este
# host teve thrashing de swap real 3 vezes numa única sessão rodando a stack
# inteira; diferente de limites de recurso (que só limitam o teto), desligar
# isso libera memória de verdade. cluster.id/name são inofensivos de manter
# (metadado de identidade barato, sem componente rodando), deixados caso o
# clustermesh seja reabilitado depois.
#
# Para reabilitar: definir clustermesh.useAPIServer: true e restaurar o bloco
# clustermesh.config/apiserver do histórico do git (este arquivo, antes deste
# commit) — apiserver.service.type: LoadBalancer, kvstoremesh.enabled: true,
# tls.auto.enabled: true, config.enabled: true (obrigatório, senão o
# clustermesh-apiserver trava em Init com FailedMount).
cluster:
  id: 1
  name: batata

clustermesh:
  useAPIServer: false
