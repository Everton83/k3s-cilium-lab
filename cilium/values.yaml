# Cilium Helm values — release "cilium" in namespace kube-system (chart cilium-1.20.1)
# Applied on batata-server (k3s single-node, 192.168.3.200).
# Reproduce with:  helm upgrade --install cilium cilium/cilium -n kube-system \
#                    --version 1.20.1 -f values.yaml
#
# NOTE: `loadBalancer.l2.enabled` below is NOT a real chart key (no-op) — it was
#       left as originally applied. The key that actually enables L2 is
#       `l2announcements.enabled` (set to true further down).
#
# resources: blocks added 2026-09-11, sized off observed steady-state RSS,
# part of fitting the whole batata-server stack in a ~3GB budget after a
# swap-thrashing incident (see ../README.md's incident log). Verify with
# `helm upgrade --dry-run` before applying — this chart controls the CNI.

k8sServiceHost: 192.168.3.200
k8sServicePort: 6443
kubeProxyReplacement: true

operator:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 160Mi

tolerations:
  - operator: Exists

# --- Gateway API (host-network mode: Envoy binds the listener port on the node IP) ---
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true

# Envoy (external DaemonSet) needs NET_BIND_SERVICE to bind privileged port 80 on the host.
# Both of these are required together.
envoy:
  securityContext:
    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
      keepCapNetBindService: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 300m
      memory: 96Mi

securityContext:
  capabilities:
    envoy:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
      - PERFMON
      - DAC_OVERRIDE
      - FOWNER
      - IPC_LOCK
      - NET_BIND_SERVICE

# cilium-agent itself (the DaemonSet's main container).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# --- LoadBalancer: L2 announcements + LB-IPAM (pool defined in loadbalancer-ippool.yaml) ---
l2announcements:
  enabled: true
  leaseDuration: 15s
  leaseRenewDeadline: 5s
  leaseRetryPeriod: 2s

loadBalancer:
  l2:
    enabled: true   # no-op key (see note at top)

k8sClientRateLimit:
  qps: 50
  burst: 100

# --- Hubble ---
hubble:
  enabled: true
  relay:
    enabled: true

# --- ClusterMesh: DISABLED 2026-09-11 ---
# Was enabled 2026-09-10 but never actually peered with anything (always
# 0/0 remote clusters) — 3 always-on containers (etcd, apiserver,
# kvstoremesh) for a feature doing nothing. This box hit real swap-thrashing
# 3 times in one session running the full stack; unlike resource limits
# (which only cap the ceiling), turning this off frees memory for real.
# cluster.id/name are harmless to keep (cheap identity metadata, no running
# component), left in case clustermesh gets re-enabled later.
#
# To re-enable: set clustermesh.useAPIServer: true and restore the
# clustermesh.config/apiserver block from git history (this file, prior to
# this commit) — apiserver.service.type: LoadBalancer, kvstoremesh.enabled:
# true, tls.auto.enabled: true, config.enabled: true (required, or
# clustermesh-apiserver hangs in Init on FailedMount).
cluster:
  id: 1
  name: batata

clustermesh:
  useAPIServer: false
